# 生产环境配置 - 使用外部 PostgreSQL，不启动 postgres 容器
# 使用方法: docker compose -f docker-compose.prod.yml up -d
#
# 部署前准备:
# 1. 复制 server/.env.example 为 server/.env，填写云数据库连接信息
# 2. 确保数据库已创建，本系统表名使用 pf_ 前缀，不会影响其他系统
# 3. 修改 CLIENT_PORT 端口（如需要）

services:
  server:
    image: 11baixiangguo2-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: passion-fruit-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - ./server/.env
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - passion-fruit-net

  client:
    image: 11baixiangguo2-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: passion-fruit-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - passion-fruit-net

networks:
  passion-fruit-net:
    driver: bridge
