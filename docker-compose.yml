services:
  mysql:
    image: mysql:8.0
    container_name: passion-fruit-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-passion_fruit}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/config/init-data.sql:/docker-entrypoint-initdb.d/01-init-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: 11baixiangguo2-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: passion-fruit-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-passion_fruit}
      PORT: 3001
      OPENCLAW_STATE_DIR: /openclaw_data/openclaw-weixin
    volumes:
      - openclaw_data:/openclaw_data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      openclaw:
        condition: service_started
    shm_size: '2gb'
    cap_add:
      - SYS_ADMIN

  client:
    image: 11baixiangguo2-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: passion-fruit-client
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - server

  openclaw:
    image: ghcr.nju.edu.cn/openclaw/openclaw:latest
    build:
      context: ./.openclaw
      dockerfile: Dockerfile
    container_name: passion-fruit-openclaw
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-sk-3dfc03f09fe0483d91ff2ad84bfe2d13}
    ports:
      - "18789:18789"
    volumes:
      - openclaw_data:/home/node/.openclaw
      - ./.openclaw/skills:/home/node/.openclaw/skills:ro
      - ./.openclaw/scripts/query-db.js:/usr/local/bin/query-db.js:ro
      - ./.openclaw/scripts/query.sh:/usr/local/bin/query.sh:ro
      - ./.openclaw/entrypoint.sh:/home/node/entrypoint.sh:ro
    entrypoint: ["sh", "/home/node/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  openclaw_data:
