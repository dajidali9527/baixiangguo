services:
  postgres:
    image: postgres:16-alpine
    container_name: passion-fruit-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-passion_fruit}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-passion_fruit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    image: 11baixiangguo2-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: passion-fruit-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - ./server/.env
    environment:
      TZ: Asia/Shanghai
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: 5432
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-passion_fruit}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: '2gb'
    cap_add:
      - SYS_ADMIN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    image: 11baixiangguo2-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: passion-fruit-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
